name: Keep Supabase Alive

on:
  schedule:
    # Run every 3 days at midnight to prevent Supabase from pausing (pauses after 7 days of inactivity)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allow manual trigger from the GitHub Actions UI

permissions:
  actions: write

jobs:
  ping_services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database (REST API)
        # We send a GET request to the Supabase REST endpoint to generate activity.
        # It uses secrets configured in GitHub Actions to authenticate.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --silent --show-error "${SUPABASE_URL}/rest/v1/?limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" || true
          echo "Supabase ping successful (ignoring auth errors)"

      - name: Keep workflow enabled
        # Resets GitHub's 60-day inactivity timer for scheduled workflows
        run: gh api -X PUT repos/${{ github.repository }}/actions/workflows/keep_alive.yml/enable
        env:
          GH_TOKEN: ${{ github.token }}
